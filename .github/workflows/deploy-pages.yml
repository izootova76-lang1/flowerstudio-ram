name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          GITHUB_PAGES: "true"

      - name: Prepare index.html
        run: |
          set -euo pipefail
          if [ ! -d dist/client ]; then
            echo "dist/client not found"
            ls -la dist 2>/dev/null || ls -la
            exit 1
          fi
          if [ -f dist/client/_html ]; then
            cp dist/client/_html dist/client/index.html
          elif [ -f dist/client/_html.html ]; then
            cp dist/client/_html.html dist/client/index.html
          fi
          if [ ! -f dist/client/index.html ]; then
            echo "index.html missing in dist/client"
            ls -la dist/client
            exit 1
          fi
          cp dist/client/index.html dist/client/404.html
          touch dist/client/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
