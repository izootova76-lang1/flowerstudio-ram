name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          GITHUB_PAGES: "true"

      - name: Prepare GitHub Pages
        id: dist
        run: |
          set -euo pipefail
          for d in dist/client dist .output/public; do
            if [ -d "$d" ]; then
              CLIENT_DIR="$d"
              break
            fi
          done
          if [ -z "${CLIENT_DIR:-}" ]; then
            echo "Build output directory not found"
            ls -la
            exit 1
          fi
          echo "Using output directory: $CLIENT_DIR"
          if [ -f "$CLIENT_DIR/_shell.html" ] && [ ! -f "$CLIENT_DIR/index.html" ]; then
            cp "$CLIENT_DIR/_shell.html" "$CLIENT_DIR/index.html"
          fi
          if [ -f "$CLIENT_DIR/index.html" ]; then
            cp "$CLIENT_DIR/index.html" "$CLIENT_DIR/404.html"
          elif [ -f "$CLIENT_DIR/_shell.html" ]; then
            cp "$CLIENT_DIR/_shell.html" "$CLIENT_DIR/index.html"
            cp "$CLIENT_DIR/_shell.html" "$CLIENT_DIR/404.html"
          else
            echo "Neither index.html nor _shell.html found in $CLIENT_DIR"
            ls -la "$CLIENT_DIR"
            exit 1
          fi
          touch "$CLIENT_DIR/.nojekyll"
          echo "dir=$CLIENT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.dist.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
