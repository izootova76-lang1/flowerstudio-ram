name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        env:
          GITHUB_PAGES: "true"
        run: |
          set -euo pipefail
          bun run build

          echo "Build output:"
          ls -la
          ls -la .output .output/public dist dist/client 2>/dev/null || true

          CLIENT_DIR=""
          for d in \
            .output/public \
            .output/public/flowerstudio-ram \
            dist/client \
            dist/public \
            dist
          do
            if [ -d "$d" ] && { [ -f "$d/index.html" ] || [ -f "$d/_shell.html" ]; }; then
              CLIENT_DIR="$d"
              break
            fi
          done
          if [ -z "$CLIENT_DIR" ]; then
            FOUND="$(find .output dist -type f \( -name 'index.html' -o -name '_shell.html' \) 2>/dev/null | head -n 1 || true)"
            if [ -n "$FOUND" ]; then
              CLIENT_DIR="$(dirname "$FOUND")"
            fi
          fi
          if [ -z "$CLIENT_DIR" ]; then
            echo "SPA HTML not found in build output"
            find .output dist -type f -name '*.html' 2>/dev/null || true
            exit 1
          fi

          echo "Using output directory: $CLIENT_DIR"
          if [ -f "$CLIENT_DIR/_shell.html" ] && [ ! -f "$CLIENT_DIR/index.html" ]; then
            cp "$CLIENT_DIR/_shell.html" "$CLIENT_DIR/index.html"
          fi
          if [ ! -f "$CLIENT_DIR/index.html" ]; then
            echo "index.html missing in $CLIENT_DIR"
            ls -la "$CLIENT_DIR"
            exit 1
          fi

          rm -rf pages-dist
          mkdir pages-dist
          cp -a "$CLIENT_DIR"/. pages-dist/
          rm -f pages-dist/README.md pages-dist/readme.md
          cp pages-dist/index.html pages-dist/404.html
          touch pages-dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
